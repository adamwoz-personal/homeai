[project]
name = "homeai"
version = "0.1.0"
description = "Local voice assistant front-end for the ZeroClaw agent"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Adam Wosotowsky" }]
license = { file = "LICENSE" }
classifiers = [
    # BSL 1.1 is source-available, not OSI-approved. This classifier prevents
    # tooling from mistaking it for an open source licence.
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
dependencies = ["numpy", "requests", "sounddevice", "onnxruntime", "websockets"]

[project.optional-dependencies]
# The wake word and speech synthesis. Separate so the unit tests and the MCP
# server can be installed without them. Lower bounds are the tested versions.
voice = ["openwakeword>=0.4", "piper-tts>=1.8"]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["homeai*"]

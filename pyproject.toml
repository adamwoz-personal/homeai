[project]
name = "homeai"
version = "0.1.0"
description = "Local voice assistant front-end for the ZeroClaw agent"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Adam Wosotowsky" }]
license = { file = "LICENSE" }
classifiers = [
    # BSL 1.1 is source-available, not OSI-approved. This classifier prevents
    # tooling from mistaking it for an open source licence.
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
dependencies = ["numpy", "requests", "sounddevice", "onnxruntime", "websockets"]

[project.optional-dependencies]
# The wake word and speech synthesis. Separate so the unit tests and the MCP
# server can be installed without them. Lower bounds are the tested versions.
voice = ["openwakeword>=0.4", "piper-tts>=1.8"]
dev = ["pytest", "pytest-cov"]
# Avatar window (plans/AVATAR_PLAN.md). The daemon never imports these.
avatar = ["pygame-ce>=2.5.8", "moderngl>=5.13"]
# Offline avatar asset pipeline; onnx is only for patching the Piper voice
# with phoneme alignments at install time.
avatar-build = ["mediapipe>=1.1", "opencv-python-headless>=5.0", "scipy>=1.18", "onnx"]
# Long-term memory (plans/MEMORY_PLAN.md): PostgreSQL 16+ with pgvector, and
# a small ONNX embedding model fetched by tools/memory/embed_bench.py --download.
memory = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3", "tokenizers>=0.20", "huggingface_hub>=0.25"]
# Remote app (plans/REMOTE_APP_PLAN.md): the Noise channel to the phone, tested
# against noise-java by tools/noise_interop.py.
remote = ["noiseprotocol>=0.3.1", "cryptography>=42"]

[tool.setuptools.package-data]
"homeai.memory_store" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["homeai*"]

[Service]
# Ollama keeps up to 3 models resident per GPU by default. On 2026-09-23 that
# default stacked several test models on top of llama-server's ~13GB, exceeded
# the RX 7900 XT's 20GB, spilled into system RAM and hard-OOM'd the host into a
# reboot. This card can hold llama-server plus exactly one Ollama model.
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Only one model may be loaded at a time (above), so pinning it costs a bounded
# ~7GB and keeps the voice assistant instant. Without this the model is evicted
# after 5 idle minutes and the next spoken question pays a reload.
# Set to "5m" instead if you would rather reclaim the VRAM when idle.
Environment="OLLAMA_KEEP_ALIVE=-1"

# One request at a time. Parallel decoding allocates a KV cache per slot, which
# is how a "small" model quietly becomes a large one.
Environment="OLLAMA_NUM_PARALLEL=1"
